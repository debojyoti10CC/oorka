name: Demo market

# Keeps the public testnet pool trading so the arena has real swaps to score: every 15 minutes, one run walks the
# price toward a slowly moving target and adds a few round trips for fee volume (frontend/scripts/market.mjs).
# Settlement is not done here. The Reactive Network keeper settles epochs on its own.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: market
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # lets the job re-dispatch itself

jobs:
  trade:
    runs-on: ubuntu-latest
    # GitHub drops many scheduled triggers on this repo, so one run trades every 15 minutes for ~5.5 hours and
    # then dispatches the next run itself. The schedule above stays as a backup starter.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Trade every 15 minutes
        env:
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
        run: |
          for i in $(seq 1 21); do
            node scripts/market.mjs || echo "run $i failed, continuing"
            if [ "$i" -lt 21 ]; then sleep 900; fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run market.yml --ref main -R ${{ github.repository }}
