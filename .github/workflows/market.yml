name: Demo market

# Keeps the public testnet pool trading so the arena has real swaps to score: every 15 minutes, one run walks the
# price toward a slowly moving target and adds a few round trips for fee volume (frontend/scripts/market.mjs).
# Settlement is not done here. The Reactive Network keeper settles epochs on its own.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/market.mjs
        env:
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
