name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Foundry build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Install dependencies
        run: |
          forge install Uniswap/v4-periphery@c6e4754dab11bd38c6f08ac51c3c868569e93d64 --no-git
          forge install foundry-rs/forge-std --no-git

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Upload build artifacts (ABIs + bytecode for the frontend and Node deploy script)
        uses: actions/upload-artifact@v4
        with:
          name: contracts-out
          path: |
            contracts/out/OorkaHook.sol/OorkaHook.json
            contracts/out/OorkaKeeper.sol/OorkaKeeper.json
            contracts/out/OorkaReactive.sol/OorkaReactive.json
            contracts/out/PoolSwapTest.sol/PoolSwapTest.json
            contracts/out/PoolModifyLiquidityTest.sol/PoolModifyLiquidityTest.json
            contracts/out/MockERC20.sol/MockERC20.json
            contracts/out/PoolManager.sol/PoolManager.json
          if-no-files-found: error

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
