name: Docs

# Builds the Mintlify docs in docs-site/ as a static site and publishes it to the debojyoti10CC/oorka-docs repo,
# which GitHub Pages serves at https://oorkadocs.djyo.tech. Auth is a write deploy key scoped to that one repo.
on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links
        working-directory: docs-site
        run: npx -y mint@latest broken-links
      - name: Export static site
        working-directory: docs-site
        run: npx -y mint@latest export --output "$RUNNER_TEMP/docs.zip"
      - name: Prepare site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/docs.zip"
          rm -f "Start Docs.bat" "Start Docs.command" serve.js
          echo "oorkadocs.djyo.tech" > CNAME
          touch .nojekyll
          cat > README.md <<'EOF'
          # Oorka docs (built site)

          Static export of the Mintlify docs in [debojyoti10CC/oorka/docs-site](https://github.com/debojyoti10CC/oorka/tree/main/docs-site), served at https://oorkadocs.djyo.tech.

          Do not edit here. The `Docs` workflow in the main repo overwrites this repo on every change to `docs-site/`.
          EOF
      - name: Push to oorka-docs
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOCS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd "$RUNNER_TEMP/site"
          git init -q -b main
          git config user.name "oorka-docs-bot"
          git config user.email "oorka-docs-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish docs from ${GITHUB_SHA::7}"
          git push -f git@github.com:debojyoti10CC/oorka-docs.git main
